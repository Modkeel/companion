modLoader = "javafml"
loaderVersion = "[47,)"
license = "MIT"
issueTrackerURL = "https://github.com/Modkeel/companion/issues"

[[mods]]
modId = "modkeel"
version = "${version}"
displayName = "Modkeel Companion"
displayURL = "https://modkeel.com"
updateJSONURL = "${updates}"
authors = "Modkeel"
description = "Backs up your worlds when your mods change, explains crashes and fixes them in one click. No mixins."

[[dependencies.modkeel]]
modId = "forge"
mandatory = true
versionRange = "${forge}"
ordering = "NONE"
side = "BOTH"

[[dependencies.modkeel]]
modId = "minecraft"
mandatory = true
versionRange = "${minecraft}"
ordering = "NONE"
side = "BOTH"
