name: Keel modpack problem
description: Keel Performance, Keel Shaders or Keel Vanilla+ crashes, will not install, or runs worse than it should.
labels: ["pack"]
body:
  - type: markdown
    attributes:
      value: Thanks for reporting. Each Keel pack is tested together before release, so a problem here is one we want to see.
  - type: dropdown
    id: pack
    attributes:
      label: Pack
      options: [Keel Performance, Keel Shaders, Keel Vanilla+]
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Pack version and Minecraft version
      description: Shown in the launcher, e.g. 0.1.0 for 26.2.
      placeholder: 0.1.0 for 26.2
    validations:
      required: true
  - type: dropdown
    id: launcher
    attributes:
      label: Launcher
      options: [CurseForge app, Prism Launcher, Modrinth App, ATLauncher, Other]
    validations:
      required: true
  - type: dropdown
    id: kind
    attributes:
      label: What kind of problem
      options: [Crash or will not start, Low FPS or stutter, A mod or feature is missing, Will not install, Something else]
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you saw, and anything you added or changed in the pack.
    validations:
      required: true
  - type: textarea
    id: specs
    attributes:
      label: PC
      description: Graphics card, RAM given to Minecraft, and the shader pack if you use one.
      placeholder: GeForce GTX 1650, 4 GB, Complementary Reimagined
  - type: textarea
    id: log
    attributes:
      label: Crash report or log
      description: Paste crash-reports/crash-*.txt or logs/latest.log from the instance folder, or a link to mclo.gs.
      render: text
